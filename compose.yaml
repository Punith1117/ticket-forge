services:
  postgres:
    image: postgres:18
    container_name: ticketforge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - ticketforge_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticketforge-mailpit
    restart: unless-stopped

    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

    environment:
      MP_DATABASE: /data/mailpit.db

    volumes:
      - ticketforge_mailpit_data:/data:Z

volumes:
  ticketforge_postgres_data:
  ticketforge_mailpit_data:
